<div class="category-page">

  <h1>Our Categories</h1>

  <p class="category-subtitle">
    Explore our delicious food categories
  </p>

  <div class="category-container">

    <div *ngFor="let category of categories" 
          class="category-card"
          (click)="selectCategory(category.categoryId)">
    

      <div class="category-icon">
       <span *ngIf="category.categoryName === 'Biryani'">🍚</span>

       <span *ngIf="category.categoryName === 'Starters'">🍗</span>

       <span *ngIf="category.categoryName === 'Drinks'">🥤</span>

       <span *ngIf="category.categoryName === 'Deserts'">🍰</span>

      </div>

      <h3>{{ category.categoryName }}</h3>

      <p>{{ category.description }}</p>

    </div>

  </div>

   <button 
    class="view-all-btn"
    routerLink="/food-item">
   view All Food Items
  </button>

</div>
